<svg
  class="chart"
  [attr.width]="width()"
  [attr.height]="height()"
  [class.dragging]="selection()"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointerleave)="onPointerLeave()"
  role="img"
  aria-label="Chronologie de la charge Jenkins"
>
  <!-- Plages creuses, sur toute la hauteur -->
  @for (band of idleBands(); track band.x) {
    <rect class="idle-band" [attr.x]="band.x" [attr.y]="axisHeight" [attr.width]="band.width" [attr.height]="height() - axisHeight" />
  }

  <!-- Axe temporel -->
  @for (tick of xTicks(); track tick.time) {
    <line class="grid" [class.major]="tick.major" [attr.x1]="tick.x" [attr.x2]="tick.x" [attr.y1]="axisHeight - 4" [attr.y2]="height()" />
    <text class="tick-label" [class.major]="tick.major" [attr.x]="tick.x + 4" y="14">{{ tick.label }}</text>
  }

  <!-- Courbe de charge -->
  @for (tick of yTicks(); track tick.value) {
    <line class="grid horizontal" [attr.x1]="margin.left" [attr.x2]="width() - margin.right" [attr.y1]="tick.y" [attr.y2]="tick.y" />
    <text class="y-label" [attr.x]="margin.left - 8" [attr.y]="tick.y + 4">{{ tick.value }}</text>
  }
  <path class="load-area" [attr.d]="averagePath()" />
  <path class="peak-line" [attr.d]="peakPath()" />
  @if (capacityY(); as capacityY) {
    <line class="capacity" [attr.x1]="margin.left" [attr.x2]="width() - margin.right" [attr.y1]="capacityY" [attr.y2]="capacityY" />
  }

  <!-- Builds, rangés par ligne -->
  @for (bar of buildBars(); track bar.id) {
    <rect class="build" [class]="bar.className" [attr.x]="bar.x" [attr.y]="bar.y" [attr.width]="bar.width" [attr.height]="laneHeight" rx="2" />
  }

  @if (selection(); as selection) {
    <rect class="selection" [attr.x]="selection.x" [attr.y]="axisHeight" [attr.width]="selection.width" [attr.height]="height() - axisHeight" />
  }
  @if (hover(); as hover) {
    <line class="cursor" [attr.x1]="hover.x" [attr.x2]="hover.x" [attr.y1]="axisHeight" [attr.y2]="height()" />
  }
</svg>

@if (hover(); as hover) {
  <div class="tooltip" [style.left.px]="hover.x" [style.top.px]="hover.y" [class.flip]="hover.x > width() - 260">
    <strong>{{ hover.title }}</strong>
    @for (line of hover.lines; track $index) {
      <span>{{ line }}</span>
    }
  </div>
}
